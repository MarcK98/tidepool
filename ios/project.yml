name: Tidepool
options:
  bundleIdPrefix: ai.tidepool
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Ad-hoc signing only: the demo never leaves the simulator, and a team id
    # in here would break any machine but the one that generated it.
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO

targets:
  Tidepool:
    type: application
    platform: iOS
    sources:
      - path: Tidepool
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.tidepool.Tidepool
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  TidepoolTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TidepoolTests
    dependencies:
      - target: Tidepool
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ai.tidepool.TidepoolTests

schemes:
  Tidepool:
    build:
      targets:
        Tidepool: all
        TidepoolTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TidepoolTests
