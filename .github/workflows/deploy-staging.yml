name: Deploy Staging

# The release half of the loop. AgentDeck's team lead runs this by name
# (`gh workflow run "Deploy Staging"`) once a PR has been signed off and CI is
# green, so the display name here is load-bearing — it is what the project's
# `deployWorkflow` setting points at.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  build:
    name: Build staging bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        # Pages serves the site from /<repo>/, so the asset base has to match or
        # every script tag 404s.
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Stamp the build
        working-directory: web
        run: |
          printf '%s\n' \
            "commit=${GITHUB_SHA}" \
            "ref=${GITHUB_REF_NAME}" \
            "run=${GITHUB_RUN_NUMBER}" > dist/BUILD

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    name: Deploy to staging
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  notify:
    name: Announce the release
    needs: deploy
    runs-on: ubuntu-latest
    # Job-level, deliberately: a step's `if` can read the `env` context, but not
    # env declared on that same step, so gating on secrets has to happen here.
    env:
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
    steps:
      # Two independent announcements, and neither can break the other:
      #
      #   1. this notice — always published, no secrets, picked up by
      #      scripts/watch-staging.sh on the desktop, which raises a banner
      #   2. the email below — only when MAIL_* secrets exist
      #
      # The notice goes first so the banner is never waiting on SMTP.
      #
      # Values arrive through `env` rather than being interpolated into the
      # script body, so a branch name can't inject shell.
      - name: Publish the release notice
        env:
          BUILD: ${{ github.run_number }}
          URL: ${{ needs.deploy.outputs.url }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n \
            --arg build       "$BUILD" \
            --arg url         "$URL" \
            --arg sha         "$SHA" \
            --arg ref         "$REF" \
            --arg repo        "$REPO" \
            --arg run_url     "$RUN_URL" \
            --arg deployed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{build:$build, url:$url, sha:$sha, ref:$ref, repo:$repo,
              run_url:$run_url, deployed_at:$deployed_at}' > release-notice.json
          cat release-notice.json

      - name: Upload the release notice
        uses: actions/upload-artifact@v4
        with:
          name: release-notice
          path: release-notice.json
          retention-days: 7

      # Skipped rather than failed when the mailbox secrets aren't configured:
      # a missing app password must not turn a good deploy red.
      - name: Send release email
        if: ${{ env.MAIL_USERNAME != '' && env.MAIL_PASSWORD != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Tidepool Releases <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO || secrets.MAIL_USERNAME }}
          subject: "✅ Tidepool staging deployed — build #${{ github.run_number }}"
          html_body: |
            <div style="font-family:-apple-system,Segoe UI,sans-serif;max-width:520px">
              <h2 style="margin:0 0 4px">Tidepool staging is live</h2>
              <p style="color:#667;margin:0 0 18px">Build #${{ github.run_number }} · ${{ github.ref_name }}</p>
              <p><a href="${{ needs.deploy.outputs.url }}"
                    style="background:#1b6f8f;color:#fff;padding:10px 18px;border-radius:8px;text-decoration:none">
                    Open staging</a></p>
              <p style="color:#667;font-size:13px">
                Commit <code>${{ github.sha }}</code><br>
                <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">Workflow run</a>
              </p>
            </div>

      - name: Note when email is not configured
        if: ${{ env.MAIL_USERNAME == '' || env.MAIL_PASSWORD == '' }}
        run: |
          echo "::notice title=No release email::Set MAIL_USERNAME and MAIL_PASSWORD repo secrets to also email on deploy. The release notice was published either way, so scripts/watch-staging.sh still raises a desktop banner."

      - name: Summary
        run: |
          {
            echo "### Staging deployed"
            echo ""
            echo "- URL: ${{ needs.deploy.outputs.url }}"
            echo "- Build: #${{ github.run_number }} (\`${{ github.sha }}\`)"
          } >> "$GITHUB_STEP_SUMMARY"
