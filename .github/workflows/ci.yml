name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web — typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 5

  ios:
    name: iOS — build & unit tests
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      # The device list on GitHub's macOS images changes between rollouts, so
      # the destination is discovered rather than hard-coded. See the script.
      - name: Resolve simulator
        id: sim
        run: echo "dest=$(./scripts/simulator-destination.sh)" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          xcodebuild test \
            -project Tidepool.xcodeproj \
            -scheme Tidepool \
            -destination "${{ steps.sim.outputs.dest }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ios/TestResults.xcresult
          retention-days: 5
          if-no-files-found: ignore
